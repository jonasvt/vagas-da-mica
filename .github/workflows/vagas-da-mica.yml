name: Vagas da Mica

# Busca as vagas e publica o site no GitHub Pages — a cada 2 horas, com o PC desligado.
# O site vai para a branch gh-pages sempre com um commit só (sem acumular histórico).
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vagas-da-mica
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Buscar vagas
        # Lê as vagas que já estão no site (para lembrar o que é novo) e junta com as de agora
        run: python -m vagas site --anterior "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/vagas.json"

      - name: Publicar no GitHub Pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "robo-das-vagas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "vagas atualizadas $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
